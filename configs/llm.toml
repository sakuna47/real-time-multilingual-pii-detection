# LLM providers and roles. Read by src/llm/config.py.
#
# Model ids are written as "<provider>:<model>". Check what your keys can use with
#   python -m src.llm.smoke --list-models
# and pick the translator from the FLORES benchmark (src/translate/benchmark.py) before scaling up.
# Changing a model or prompt changes the cache key, so old cached answers are not reused.

[providers.gemini]
key_env = "GEMINI_API_KEY"
rpm = 10                    # requests per minute; set to your tier's limit
timeout_s = 120

[providers.vertex]
# Vertex AI on your Google Cloud project (billed to its credits). Auth: Application Default
# Credentials (gcloud auth application-default login / Colab auth), or VERTEX_API_KEY (express mode).
project_env = "GOOGLE_CLOUD_PROJECT"
location = "global"          # overridden by GOOGLE_CLOUD_LOCATION
key_env = "VERTEX_API_KEY"
rpm = 60
timeout_s = 180

[providers.openrouter]
key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
rpm = 20
timeout_s = 120
json_response_format = false  # not every routed model supports it; we parse JSON from the text instead

[providers.deepseek]
key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com"
rpm = 30
timeout_s = 180
json_response_format = true

[providers.mock]
rpm = 0                     # 0 = no rate limit

# ---------------------------------------------------------------- roles
# The judge must use a different model from every generating role (checked on load).

[roles.translator]
model = "vertex:gemini-3.5-flash"
temperature = 0.2
max_tokens = 8192
thinking_budget = 0         # Gemini: no hidden reasoning (billed as output); see FLORES check

[roles.codemixer]
model = "vertex:gemini-3.5-flash"
temperature = 0.5
max_tokens = 8192
thinking_budget = 0         # Gemini: no hidden reasoning (billed as output); see FLORES check

[roles.inserter]
model = "vertex:gemini-3.5-flash"
temperature = 0.3
max_tokens = 8192
thinking_budget = 0         # Gemini: no hidden reasoning (billed as output); see FLORES check

[roles.judge]
# a different model from the generating roles (checked on load); scores records, see src/validate/judge.py
model = "vertex:gemini-3.5-flash-lite"
temperature = 0.0
max_tokens = 8192
thinking_budget = 0

[roles.transliterator]
# fills missing Sinhala/Tamil spellings in resources/sl (src/sl_gen/fill_scripts.py); output is human-reviewed
model = "vertex:gemini-3.5-flash"
temperature = 0.0
max_tokens = 8192
thinking_budget = 0         # Gemini: no hidden reasoning (billed as output); see FLORES check

[roles.smoke]
model = "gemini:gemini-2.5-flash"
temperature = 0.0
max_tokens = 1024
